<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Pedidos 30h+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    <div id="loginScreen" class="min-h-screen flex items-center justify-center bg-gray-900 absolute inset-0 z-50">
        <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md">
            <h2 class="text-2xl font-bold text-center mb-6 text-blue-900">Acesso Restrito</h2>
            <input type="email" id="emailInput" class="w-full p-3 mb-4 border rounded" placeholder="E-mail">
            <input type="password" id="passwordInput" class="w-full p-3 mb-4 border rounded" placeholder="Senha">
            <button onclick="window.fazerLogin()" class="w-full bg-blue-600 text-white p-3 rounded font-bold">Entrar</button>
        </div>
    </div>

    <div class="main-ui hidden max-w-6xl mx-auto p-4">
        <header class="bg-blue-900 text-white p-6 rounded-t-lg flex justify-between items-center">
            <h1 class="text-2xl font-bold">Dashboard - Pedidos Parados (30h+)</h1>
            <div class="flex gap-2">
                <button onclick="window.saveCurrentReport()" id="btnSave" class="hidden bg-yellow-500 text-black px-4 py-2 rounded font-bold">💾 Salvar</button>
                <label class="bg-blue-600 px-4 py-2 rounded cursor-pointer font-bold">📁 Nova Análise<input type="file" class="hidden" onchange="window.handleFileUpload(event)"></label>
                <button onclick="window.fazerLogout()" class="bg-red-600 px-4 py-2 rounded font-bold">Sair</button>
            </div>
        </header>

        <div class="bg-white shadow-md rounded-b-lg mb-6 flex border-b">
            <button onclick="window.switchTab('tab-analise')" class="tab-btn active flex-1 py-4 font-bold border-b-4 border-blue-600">📊 Visão Geral</button>
            <button onclick="window.switchTab('tab-historico')" class="tab-btn flex-1 py-4">🗂️ Histórico</button>
            <button onclick="window.switchTab('tab-conta')" class="tab-btn flex-1 py-4">👤 Minha Conta</button>
        </div>

        <div id="tab-analise" class="flex flex-col gap-6">
            <div id="emptyState" class="bg-white p-12 text-center rounded-lg shadow-md">Carregue uma planilha para iniciar.</div>
            <div id="uiArea" class="hidden flex-col gap-6">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-gray-900 p-6 rounded-lg text-white shadow-xl">
                        <table class="w-full dark-table" id="mainTable"><thead><tr><th>Status</th><th>Setor</th><th>QTD</th></tr></thead><tbody id="tableBody"></tbody></table>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-md"><canvas id="sectorChart" class="h-64"></canvas></div>
                </div>
                <div class="bg-white p-4 rounded-lg shadow-md flex justify-between items-center border">
                    <h3 class="font-bold">Mensagem Automática</h3>
                    <button onclick="window.gerarEcopiarMensagem()" class="bg-green-600 text-white px-4 py-2 rounded font-bold text-sm">📋 Gerar e Copiar</button>
                    <textarea id="reportText" class="hidden"></textarea>
                </div>
                <div id="setoresContainer" class="grid grid-cols-1 gap-6"></div>
            </div>
        </div>
        <div id="tab-historico" class="hidden"><div class="bg-white p-6 rounded-lg shadow-md"><table class="w-full"><tbody id="historyTableBody"></tbody></table></div></div>
        <div id="tab-conta" class="hidden"><div class="bg-white p-6 rounded-lg shadow-md max-w-lg mx-auto">
            <input type="password" id="currentPasswordInput" class="w-full p-3 mb-2 border rounded" placeholder="Senha Atual">
            <input type="password" id="newPasswordInput" class="w-full p-3 mb-2 border rounded" placeholder="Nova Senha">
            <button onclick="window.alterarSenha()" class="w-full bg-blue-600 text-white p-3 rounded font-bold">Atualizar</button>
            <p id="passwordMsg" class="mt-4 text-center font-bold"></p>
        </div></div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
