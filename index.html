<!-- ABA 1: ANÁLISE (Layout Atualizado) -->
<div id="tab-analise" class="flex flex-col gap-6">
    <div id="emptyState" class="bg-white p-12 text-center rounded-lg shadow-md text-gray-500">
        <span class="text-4xl mb-4 block">📈</span>
        <p class="text-lg">Carregue uma planilha para visualizar os dados por setor.</p>
    </div>

    <div id="uiArea" class="hidden flex-col gap-6">
        <!-- Barra de Ação Rápida -->
        <div class="bg-white p-4 rounded-lg shadow-md flex justify-between items-center border border-gray-300">
            <h3 class="font-bold text-gray-800">Gerador de Mensagem</h3>
            <button onclick="gerarEcopiarMensagem()" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-lg font-bold text-sm">
                📋 Gerar e Copiar
            </button>
            <textarea id="reportText" class="hidden"></textarea>
        </div>

        <!-- CONTAINERS POR SETOR (Dinâmicos) -->
        <div id="setoresContainer" class="grid grid-cols-1 gap-6">
            <!-- Os blocos de setor serão injetados aqui pelo JS -->
        </div>
    </div>
</div>
